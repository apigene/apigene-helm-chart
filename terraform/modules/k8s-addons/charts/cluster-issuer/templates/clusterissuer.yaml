apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}
spec:
  acme:
    server: {{ .Values.acmeServer | quote }}
    email: {{ .Values.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.name }}
    solvers:
      # cert-manager attaches a temporary HTTPRoute for /.well-known/acme-challenge/ to
      # the Gateway's HTTP listener.
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: {{ .Values.gateway.name }}
                namespace: {{ .Values.gateway.namespace }}
                sectionName: http
