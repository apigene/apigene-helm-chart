name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: testsecret12345678901234567890123456789012
  TEARDOWN: "1"

jobs:
  chart:
    name: Chart validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Run chart tests
        run: ./scripts/ci.sh chart

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: chart
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Deploy chart to k3d
        run: |
          chmod +x scripts/*.sh tests/*.sh
          SKIP_TESTS=1 TEARDOWN=0 ./scripts/test-local-cluster.sh

      - name: Smoke and integration tests
        run: ./scripts/ci-e2e-tests.sh
        env:
          APIGENE_NAMESPACE: apigene
          APIGENE_PORT: "18080"

      - name: Tear down k3d cluster
        if: always()
        run: k3d cluster delete apigene-helm-test || true

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Validate Terraform
        run: make terraform-validate

  # Slack status for chart / e2e / terraform (success or failure).
  # This repo is public, so the org secret (visibility: private) is not injected.
  # Set repository secret SLACK_WEBHOOK_DEPLOYMENT — same value as apigene-docker-compose.
  # A missing secret must not fail CI.
  notify:
    name: Notify Slack
    needs: [chart, e2e, terraform]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check Slack webhook configured
        id: slack_cfg
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOYMENT }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SLACK_WEBHOOK_DEPLOYMENT is not configured; skipping Slack notification."
          fi

      - name: Build Slack payload
        if: steps.slack_cfg.outputs.enabled == 'true'
        env:
          CHART_RESULT: ${{ needs.chart.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          TF_RESULT: ${{ needs.terraform.result }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RAW: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          SUBJECT=$(printf '%s' "$RAW" | head -n1 | tr -d '\r' | tr -d '[:cntrl:]')
          if [ -z "$SUBJECT" ]; then
            SUBJECT="No commit message available."
          fi
          FAILED=""
          for pair in "chart:${CHART_RESULT}" "e2e:${E2E_RESULT}" "terraform:${TF_RESULT}"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" = "failure" ]; then
              if [ -n "$FAILED" ]; then
                FAILED="${FAILED}, ${name}"
              else
                FAILED="$name"
              fi
            fi
          done
          if [ -n "$FAILED" ]; then
            TITLE="helm-chart CI failed"
            HEX="#E01E5A"
            DETAIL="failed: \`${FAILED}\` · chart=\`${CHART_RESULT}\` · e2e=\`${E2E_RESULT}\` · terraform=\`${TF_RESULT}\`"
          elif [ "$CHART_RESULT" = "success" ] && [ "$E2E_RESULT" = "success" ] && [ "$TF_RESULT" = "success" ]; then
            TITLE="helm-chart CI succeeded"
            HEX="#2EB67D"
            DETAIL="chart=\`${CHART_RESULT}\` · e2e=\`${E2E_RESULT}\` · terraform=\`${TF_RESULT}\`"
          else
            TITLE="helm-chart CI finished"
            HEX="#ECB22E"
            DETAIL="chart=\`${CHART_RESULT}\` · e2e=\`${E2E_RESULT}\` · terraform=\`${TF_RESULT}\`"
          fi
          jq -n \
            --arg title "$TITLE" \
            --arg hex "$HEX" \
            --arg detail "$DETAIL" \
            --arg ref "$REF_NAME" \
            --arg sha "${SHA:0:7}" \
            --arg actor "$ACTOR" \
            --arg msg "$SUBJECT" \
            --arg url "$RUN_URL" \
            '{
              text: ($title + " — " + $ref),
              attachments: [
                {
                  color: $hex,
                  blocks: [
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: ("*" + $title + "* · `" + $ref + "` · `" + $sha + "`\n" + $detail + " · `" + $actor + "`\n" + $msg)
                      }
                    },
                    {
                      type: "actions",
                      elements: [
                        {
                          type: "button",
                          text: {
                            type: "plain_text",
                            text: "View workflow",
                            emoji: false
                          },
                          url: $url
                        }
                      ]
                    }
                  ]
                }
              ]
            }' > "$RUNNER_TEMP/slack-payload.json"

      - name: Send Slack Notification
        if: steps.slack_cfg.outputs.enabled == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOYMENT }}
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
