# Amazon EKS overrides: an Application Load Balancer from the AWS Load Balancer
# Controller (Gateway API) in front of the in-cluster nginx router. Layer on top of
# values-production.yaml:
#
#   helm install apigene ./chart/apigene -n apigene --create-namespace \
#     -f chart/apigene/values-production.yaml \
#     -f chart/apigene/values-aws.yaml \
#     --set publicUrl=https://apigene.example.com \
#     --set gateway.aws.certificateArn=arn:aws:acm:<region>:<account>:certificate/<id> \
#     --set networkPolicy.ingressCidrs={<vpc-cidr>} \
#     --set auth.existingSecret=apigene-env
#
# Requirements:
#   - AWS Load Balancer Controller v2.14+ started after the Gateway API CRDs (v1.6) were
#     installed, and a GatewayClass "alb" with controllerName gateway.k8s.aws/alb
#     (terraform/modules/aws-load-balancer-controller sets up all three)
#   - An ACM certificate for the hostname (or leave certificateArn empty for discovery)
#   - The EBS CSI driver and a gp3 StorageClass for the MongoDB volume
#
# Why not API Gateway in front: its integrations time out after 29s (15 min with REST
# response streaming), while MCP streams stay open for up to an hour.

gateway:
  enabled: true
  className: alb
  # TLS comes from ACM, not cert-manager.
  annotations:
    cert-manager.io/cluster-issuer: null
  tls:
    enabled: true
  envoy:
    enabled: false
  aws:
    enabled: true
    scheme: internet-facing
    certificateArn: ""
    idleTimeoutSeconds: 3600
    # sourceRanges: ["203.0.113.0/24"]
    # wafv2AclArn: arn:aws:wafv2:<region>:<account>:regional/webacl/<name>/<id>
    # extraAttributes:
    #   - {key: deletion_protection.enabled, value: "true"}
    #   - {key: access_logs.s3.enabled, value: "true"}
    #   - {key: access_logs.s3.bucket, value: <bucket>}

mongo:
  storageClass: gp3

# IRSA or EKS Pod Identity for the apps (Bedrock, S3, Secrets Manager…).
# serviceAccount:
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/apigene

# Requires network policy enforcement in the VPC CNI add-on
# (configuration_values = {"enableNetworkPolicy": "true"}).
networkPolicy:
  enabled: true
  # Set to your VPC CIDR: the ALB reaches the nginx pods (IP targets) from its
  # addresses inside the VPC. Required; there is no safe default.
  ingressCidrs: []
