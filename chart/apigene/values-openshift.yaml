# OpenShift overrides.
# Usage:
#   helm install apigene ./chart/apigene -n <project> -f chart/apigene/values-openshift.yaml \
#     --set namespace.name=<project> \
#     --set route.host=<host> \
#     --set publicUrl=https://<host> \
#     --set auth.secretKey="$APIGENE_AUTH_SECRET" \
#     --set mongo.auth.password="$APIGENE_MONGO_PASSWORD"

deploymentType: OnPrem

service:
  type: ClusterIP

route:
  enabled: true

networkPolicy:
  enabled: true
  ingressNamespaceLabels:
    network.openshift.io/policy-group: ingress

mongo:
  storage: 10Gi
  auth:
    enabled: true
