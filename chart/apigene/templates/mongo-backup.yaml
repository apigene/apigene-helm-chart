{{- if and (include "apigene.bundledMongo" .) .Values.mongo.backup.enabled }}
{{- $ctx := dict "root" . "component" "mongo-backup" "values" .Values.mongo }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-backup
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo-backup
  annotations:
    # Keep the backups when the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with (.Values.mongo.backup.storageClass | default .Values.mongo.storageClass) }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mongo.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo-backup
spec:
  schedule: {{ .Values.mongo.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: mongo-backup
            {{- include "apigene.selectorLabels" . | nindent 12 }}
        spec:
          {{- include "apigene.podSpecCommon" $ctx | nindent 10 }}
          restartPolicy: OnFailure
          containers:
            - name: mongodump
              image: {{ include "apigene.thirdPartyImage" (dict "image" .Values.mongo.image "root" .) | quote }}
              imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
              securityContext:
                {{- include "apigene.containerSecurityContext" $ctx | nindent 16 }}
              env:
                - name: HOME
                  value: /tmp
                - name: RETENTION_DAYS
                  value: {{ .Values.mongo.backup.retentionDays | quote }}
                - name: MONGO_DB_URL
                  {{- if include "apigene.mongoAuthEnabled" . }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "apigene.secretName" . }}
                      key: MONGO_DB_URL
                  {{- else }}
                  value: {{ include "apigene.mongoUrl" . | quote }}
                  {{- end }}
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  file="/backup/apigene-$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
                  mongodump --uri="${MONGO_DB_URL}" --archive="${file}.partial" --gzip
                  mv "${file}.partial" "${file}"
                  find /backup -name 'apigene-*.archive.gz' -mtime +"${RETENTION_DAYS}" -delete
                  ls -lh /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
              {{- with .Values.mongo.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: mongo-backup
            - name: tmp
              emptyDir: {}
{{- end }}
