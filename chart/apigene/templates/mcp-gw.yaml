{{- if and .Values.backend.enabled .Values.mcpGw.enabled }}
{{- $ctx := dict "root" . "component" "mcp-gw" "values" .Values.mcpGw }}
apiVersion: v1
kind: Service
metadata:
  name: mcp-gw
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gw
spec:
  selector:
    app.kubernetes.io/component: mcp-gw
    {{- include "apigene.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gw
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gw
spec:
  replicas: {{ .Values.mcpGw.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-gw
      {{- include "apigene.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "apigene.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "apigene.podSpecCommon" $ctx | nindent 6 }}
      initContainers:
        {{- include "apigene.waitForBackendInit" . | nindent 8 }}
      containers:
        - name: mcp-gw
          image: {{ include "apigene.mcpGwImage" . | quote }}
          imagePullPolicy: {{ include "apigene.pullPolicy" . }}
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - secretRef:
                name: {{ include "apigene.secretName" . }}
          env:
            {{- include "apigene.appEnv" $ctx | nindent 12 }}
            - name: APIGENE_URL
              value: "http://nginx:{{ .Values.service.port }}"
          securityContext:
            {{- include "apigene.containerSecurityContext" $ctx | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          {{- with .Values.mcpGw.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
