{{- include "apigene.validate" . }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apigene.fullname" . }}-env
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_APIGENE_SECRET_KEY: {{ .Values.auth.secretKey | trim | quote }}
  {{- if include "apigene.mongoAuthEnabled" . }}
  MONGO_PASSWORD: {{ .Values.mongo.auth.password | quote }}
  MONGO_DB_URL: {{ printf "mongodb://%s:%s@mongo:27017/?authSource=admin&directConnection=true" (.Values.mongo.auth.username | urlquery) (.Values.mongo.auth.password | urlquery) | quote }}
  {{- else if .Values.externalMongo.enabled }}
  MONGO_DB_URL: {{ .Values.externalMongo.url | quote }}
  {{- end }}
  {{- if include "apigene.redisAuthEnabled" . }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  {{- else if and .Values.externalRedis.enabled .Values.externalRedis.password }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | quote }}
  {{- end }}
  {{- if .Values.auth.keycloak.clientSecret }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.auth.keycloak.clientSecret | quote }}
  {{- end }}
  {{- if .Values.llm.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.llm.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.license.publicKey }}
  LICENSE_PUBLIC_KEY: {{ .Values.license.publicKey | quote }}
  {{- end }}
{{- end }}
