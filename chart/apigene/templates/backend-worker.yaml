{{- if and .Values.backend.enabled .Values.backendWorker.enabled }}
{{- $ctx := dict "root" . "component" "backend-worker" "values" .Values.backendWorker }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-worker
spec:
  replicas: {{ .Values.backendWorker.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend-worker
      {{- include "apigene.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "apigene.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "apigene.podSpecCommon" $ctx | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.backendWorker.terminationGracePeriodSeconds | default 120 }}
      initContainers:
        {{- include "apigene.waitForRedisInit" . | nindent 8 }}
        {{- include "apigene.waitForBackendInit" . | nindent 8 }}
      containers:
        - name: backend-worker
          image: {{ include "apigene.backendImage" . | quote }}
          imagePullPolicy: {{ include "apigene.pullPolicy" . }}
          args: ["celery"]
          envFrom:
            - secretRef:
                name: {{ include "apigene.secretName" . }}
          env:
            {{- include "apigene.appEnv" $ctx | nindent 12 }}
          securityContext:
            {{- include "apigene.containerSecurityContext" $ctx | nindent 12 }}
          {{- if .Values.backendWorker.livenessProbe.enabled }}
          # Restart a worker that stops answering the broker. Generous timings: the
          # check starts a Python process that imports the Celery app.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A backend.logic.task.celery inspect ping -d "celery@${HOSTNAME}" --timeout 20 >/dev/null
            initialDelaySeconds: 120
            periodSeconds: 120
            timeoutSeconds: 45
            failureThreshold: 3
          {{- end }}
          {{- with .Values.backendWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
