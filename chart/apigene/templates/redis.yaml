{{- if include "apigene.bundledRedis" . }}
{{- $ctx := dict "root" . "component" "redis" "values" .Values.redis }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/component: redis
    {{- include "apigene.selectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
      {{- include "apigene.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "apigene.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "apigene.podSpecCommon" $ctx | nindent 6 }}
      containers:
        - name: redis
          image: {{ include "apigene.thirdPartyImage" (dict "image" .Values.redis.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --dir
            - /tmp
            - --loglevel
            - warning
            {{- if include "apigene.redisAuthEnabled" . }}
            - --requirepass
            - $(REDIS_PASSWORD)
            {{- end }}
          securityContext:
            {{- include "apigene.containerSecurityContext" $ctx | nindent 12 }}
          {{- if include "apigene.redisAuthEnabled" . }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apigene.secretName" . }}
                  key: REDIS_PASSWORD
            # Read by redis-cli in the probes.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "apigene.secretName" . }}
                  key: REDIS_PASSWORD
          {{- end }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "{{ .Values.redis.port }}", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "{{ .Values.redis.port }}", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
