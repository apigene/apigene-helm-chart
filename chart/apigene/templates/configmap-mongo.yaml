{{- if include "apigene.bundledMongo" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-config
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
data:
  mongod.conf: |
    storage:
      dbPath: /data/db
    # Log to stdout so kubectl logs and the cluster log pipeline see MongoDB.
    systemLog:
      quiet: true
    net:
      bindIpAll: true
      unixDomainSocket:
        pathPrefix: /tmp
    {{- if include "apigene.mongoAuthEnabled" . }}
    security:
      authorization: enabled
    {{- end }}
{{- end }}
