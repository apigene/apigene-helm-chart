{{- if and .Values.mongo.enabled (not .Values.externalMongo.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: mongo
    {{- include "apigene.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mongo
      {{- include "apigene.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mongo
        {{- include "apigene.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "apigene.imagePullSecrets" . | nindent 6 }}
      {{- include "apigene.nodeScheduling" . | nindent 6 }}
      containers:
        - name: mongo
          image: {{ include "apigene.thirdPartyImage" (dict "image" .Values.mongo.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          command: ["mongod", "--config", "/etc/mongod.conf"]
          ports:
            - name: mongo
              containerPort: 27017
          {{- if include "apigene.mongoAuthEnabled" . }}
          env:
            - name: MONGO_USERNAME
              value: {{ .Values.mongo.auth.username | quote }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apigene.secretName" . }}
                  key: MONGO_PASSWORD
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -c
                  - |
                    # The localhost exception allows only the first user, so this
                    # is a no-op once the user exists.
                    until mongosh --quiet --eval 'db.runCommand({ping: 1})' >/dev/null 2>&1; do
                      sleep 1
                    done
                    mongosh --quiet admin --eval '
                      db.createUser({
                        user: process.env.MONGO_USERNAME,
                        pwd: process.env.MONGO_PASSWORD,
                        roles: ["readWriteAnyDatabase", "dbAdminAnyDatabase"]
                      })' >/dev/null 2>&1 || true
          {{- end }}
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-config
              mountPath: /etc/mongod.conf
              subPath: mongod.conf
              readOnly: true
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "cat < /dev/null > /dev/tcp/127.0.0.1/27017"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "cat < /dev/null > /dev/tcp/127.0.0.1/27017"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          {{- with .Values.mongo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: mongo-config
          configMap:
            name: mongo-config
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        labels:
          {{- include "apigene.labels" . | nindent 10 }}
          app.kubernetes.io/component: mongo
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mongo.storageClass }}
        storageClassName: {{ .Values.mongo.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongo.storage }}
{{- end }}
