{{- if include "apigene.bundledMongo" . }}
{{- $ctx := dict "root" . "component" "mongo" "values" .Values.mongo }}
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: mongo
    {{- include "apigene.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
spec:
  serviceName: mongo
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mongo
      {{- include "apigene.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "apigene.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "apigene.podSpecCommon" $ctx | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongo
          image: {{ include "apigene.thirdPartyImage" (dict "image" .Values.mongo.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          command: ["mongod", "--config", "/etc/mongod.conf"]
          ports:
            - name: mongo
              containerPort: 27017
          securityContext:
            {{- include "apigene.containerSecurityContext" $ctx | nindent 12 }}
          env:
            # mongosh keeps its history under $HOME.
            - name: HOME
              value: /tmp
            {{- if include "apigene.mongoAuthEnabled" . }}
            - name: MONGO_USERNAME
              value: {{ .Values.mongo.auth.username | quote }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apigene.secretName" . }}
                  key: MONGO_PASSWORD
            {{- end }}
          {{- if include "apigene.mongoAuthEnabled" . }}
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -c
                  - |
                    # The localhost exception allows only the first user, so this
                    # is a no-op once the user exists.
                    until mongosh --quiet --eval 'db.runCommand({ping: 1})' >/dev/null 2>&1; do
                      sleep 1
                    done
                    # "backup" lets the mongo-backup CronJob run mongodump, which reads
                    # admin.system.version and the users that the other roles cannot.
                    mongosh --quiet admin --eval '
                      db.createUser({
                        user: process.env.MONGO_USERNAME,
                        pwd: process.env.MONGO_PASSWORD,
                        roles: ["readWriteAnyDatabase", "dbAdminAnyDatabase", "backup"]
                      })' >/dev/null 2>&1 || true
          {{- end }}
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-config
              mountPath: /etc/mongod.conf
              subPath: mongod.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - "cat < /dev/null > /dev/tcp/127.0.0.1/27017"
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "cat < /dev/null > /dev/tcp/127.0.0.1/27017"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "cat < /dev/null > /dev/tcp/127.0.0.1/27017"
            periodSeconds: 30
            timeoutSeconds: 5
          {{- with .Values.mongo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: mongo-config
          configMap:
            name: mongo-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        # volumeClaimTemplates are immutable: keep these labels free of versions.
        labels:
          {{- include "apigene.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: mongo
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mongo.storageClass }}
        storageClassName: {{ .Values.mongo.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongo.storage }}
{{- end }}
