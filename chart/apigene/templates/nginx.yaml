{{- if .Values.nginx.enabled }}
{{- $ctx := dict "root" . "component" "nginx" "values" .Values.nginx }}
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/component: nginx
    {{- include "apigene.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/component: nginx
      {{- include "apigene.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "apigene.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "apigene.podSpecCommon" $ctx | nindent 6 }}
      {{- if .Values.backend.enabled }}
      initContainers:
        {{- include "apigene.waitForBackendInit" . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ include "apigene.nginxImage" . | quote }}
          imagePullPolicy: {{ include "apigene.pullPolicy" . }}
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            {{- include "apigene.containerSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            # Let the load balancer deregister the pod before nginx stops.
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          {{- with .Values.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: tmp
          emptyDir: {}
{{- end }}
