{{- if and .Values.backend.enabled .Values.copilot.enabled }}
{{- $ctx := dict "root" . "component" "copilot" "values" .Values.copilot }}
apiVersion: v1
kind: Service
metadata:
  name: copilot
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: copilot
spec:
  selector:
    app.kubernetes.io/component: copilot
    {{- include "apigene.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot
  namespace: {{ include "apigene.namespace" . }}
  labels:
    {{- include "apigene.labels" . | nindent 4 }}
    app.kubernetes.io/component: copilot
spec:
  replicas: {{ .Values.copilot.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/component: copilot
      {{- include "apigene.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "apigene.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "apigene.podSpecCommon" $ctx | nindent 6 }}
      {{- include "apigene.copilotHostAliases" . | nindent 6 }}
      initContainers:
        {{- include "apigene.waitForBackendInit" . | nindent 8 }}
      containers:
        - name: copilot
          image: {{ include "apigene.copilotImage" . | quote }}
          imagePullPolicy: {{ include "apigene.pullPolicy" . }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ include "apigene.secretName" . }}
          env:
            {{- include "apigene.appEnv" $ctx | nindent 12 }}
          securityContext:
            {{- include "apigene.containerSecurityContext" $ctx | nindent 12 }}
          startupProbe:
            httpGet:
              path: /client-api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /client-api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /client-api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          {{- with .Values.copilot.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
