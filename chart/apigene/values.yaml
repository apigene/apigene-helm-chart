# Default values for the Apigene self-hosted platform.
# Mirrors apigene-docker-compose/.env.example — keep both in sync.

nameOverride: ""
fullnameOverride: ""

# Pin all Apigene service images (public ECR). Same as APIGENE_IMAGE_TAG in docker-compose.
imageTag: "latest"

images:
  registry: public.ecr.aws/apigene
  # Pull every image from one registry, including MongoDB, Redis and the init image.
  # Images are expected under their short names: <mirror>/apigene-backend:<tag>,
  # <mirror>/mongo:7. "./apigene images push" in apigene-docker-compose publishes them there.
  mirror: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  # Optional per-service tag overrides (APIGENE_*_IMAGE_TAG in docker-compose):
  # backendTag: ""
  # copilotTag: ""
  # mcpGwTag: ""
  # nginxTag: ""

# Logical tenant and deployment mode (passed to all app containers).
tenantName: local
# SaaS (default) or OnPrem. OnPrem enables 30-day trial + paste-license upgrade.
deploymentType: SaaS
databaseEnv: local

# OnPrem only (when deploymentType=OnPrem). SaaS ignores these.
# OnPrem boots in trial without a public key; set publicKey to accept pasted licenses.
# Prefer base64:… for PEM content. If using auth.existingSecret, put LICENSE_PUBLIC_KEY
# in that secret yourself (chart-managed secret is skipped).
license:
  publicKey: ""
  algorithm: RS256

# Browser-facing URL. When empty, defaults to http://localhost:<service.port>.
# Set for production: https://apigene.example.com
publicUrl: ""

# CORS origins. When empty, follows publicUrl.
allowedOrigins: ""

auth:
  # Self-hosted default (matches docker-compose NEXT_PUBLIC_AUTH_PROVIDER=apigene).
  provider: apigene
  # Required for production. Generate: openssl rand -hex 32
  secretKey: ""
  # Use an existing Kubernetes secret instead of creating one.
  existingSecret: ""
  # Key inside existingSecret for AUTH_APIGENE_SECRET_KEY (default key name shown).
  existingSecretKey: AUTH_APIGENE_SECRET_KEY
  # Used when provider=keycloak. Points at the OL Hub realm; Gene adds no Keycloak of its own.
  keycloak:
    # Exact issuer, including the /auth path: https://<host>/auth/realms/ol-hub
    issuer: ""
    clientId: hub-spa
    # Only for a confidential client. With existingSecret, put KEYCLOAK_CLIENT_SECRET there.
    clientSecret: ""
    scopes: openid email profile
    # Allowed token azp values, comma-separated. When empty, follows clientId.
    allowedClients: ""
    # When empty, follows publicUrl.
    redirectUri: ""

cache:
  enabled: true

logging:
  env: local

# Optional LLM provider keys (add after install via --set or values file).
llm:
  openaiApiKey: ""

namespace:
  # Use --create-namespace on helm install (avoids conflict with Helm's namespace flag).
  create: false
  name: apigene

# Init containers that wait for dependencies.
initImage:
  repository: docker.io/library/busybox
  tag: "1.36"
  pullPolicy: IfNotPresent

# --- Bundled MongoDB (default on) ---

mongo:
  enabled: true
  image:
    repository: docker.io/library/mongo
    tag: "7"
    pullPolicy: IfNotPresent
  storage: 10Gi
  storageClass: ""
  resources: {}
  # Create an application user and require authentication. Also works on a volume
  # that already holds data. Changing the password later needs a manual update in MongoDB.
  auth:
    enabled: false
    username: apigene
    # With auth.existingSecret, put MONGO_PASSWORD and MONGO_DB_URL in that secret.
    password: ""

externalMongo:
  enabled: false
  url: ""

# --- Bundled Redis (default on) ---

redis:
  enabled: true
  image:
    repository: docker.io/library/redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  resources: {}

externalRedis:
  enabled: false
  host: ""
  port: 6379

# --- Application services ---

backend:
  enabled: true
  replicas: 1
  resources: {}

backendWorker:
  enabled: true
  replicas: 1
  resources: {}

copilot:
  enabled: true
  replicas: 1
  resources: {}
  # Map publicUrl hostname to the in-cluster nginx Service IP so copilot server-side
  # auth/API calls work (docker-compose uses network_mode: service:nginx for this).
  # Enable for local k3d when publicUrl hostname is not cluster DNS (e.g. apigene.localtest).
  internalPublicUrlHostAlias: false

mcpGw:
  enabled: true
  replicas: 1
  resources: {}

nginx:
  enabled: true
  replicas: 1
  resources: {}

# --- Exposure ---

service:
  type: LoadBalancer
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: apigene.example.com
  tls:
    enabled: true
    secretName: ""

# OpenShift Route. Use instead of ingress on OpenShift.
route:
  enabled: false
  # Empty lets the router generate a hostname.
  host: ""
  # Router timeout; long-lived MCP streams need more than the 30s default.
  timeout: 3600s

# Restrict inbound traffic to this namespace and the ingress controller.
# Outbound traffic stays open: Keycloak, LLM providers and customer APIs need it.
networkPolicy:
  enabled: false
  # Labels on the ingress controller's namespace. Required when enabled.
  ingressNamespaceLabels: {}

# Node scheduling (images are linux/amd64).
nodeSelector: {}
tolerations: []
affinity: {}
